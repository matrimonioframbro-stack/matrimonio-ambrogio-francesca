<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RSVP - Ambrogio & Francesca</title>
    <link rel="stylesheet" href="styles.css?v=20260922">
  </head>
  <body>
    <header class="site-header">
      <nav class="main-nav" aria-label="Pagine principali">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="cerimonia.html">Cerimonia</a>
        <a class="nav-link" href="festa.html">Festa</a>
        <a class="nav-link" href="lista-nozze.html">Lista di nozze</a>
        <a class="nav-link" href="viaggio-islanda.html">Viaggio in Islanda</a>
        <a class="nav-link is-active" href="rsvp.html" aria-current="page">RSVP</a>
      </nav>
    </header>

    <main class="simple-page">
      <h1>RSVP</h1>

      <form class="rsvp-form" id="rsvp-form">
        <input class="form-honeypot" name="website" type="text" tabindex="-1" autocomplete="off">

        <div class="form-field">
          <label for="participant-name">Nome partecipante</label>
          <input id="participant-name" name="participantName" type="text" autocomplete="given-name" required>
        </div>

        <div class="form-field">
          <label for="participant-surname">Cognome partecipante</label>
          <input id="participant-surname" name="participantSurname" type="text" autocomplete="family-name" required>
        </div>

        <button class="form-submit" type="submit">Invia RSVP</button>

        <p class="form-message" id="rsvp-message" aria-live="polite"></p>
      </form>
    </main>

    <script src="script.js"></script>
  </body>
</html>
